name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: pip install -e ".[dev,semantic]"

      - name: Detect tests
        id: tests
        shell: bash
        run: |
          if [ -d aegisgate/tests ] && find aegisgate/tests -maxdepth 1 -name 'test_*.py' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tracked tests found under aegisgate/tests" >&2
            exit 1
          fi

      - name: Run tests
        if: matrix.python-version != '3.12'
        timeout-minutes: 8
        run: pytest -v

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        timeout-minutes: 12
        # --cov-fail-under=0 keeps the coverage floor out of *this* step so a
        # test failure is the only thing that can fail it. The floor is checked
        # separately below.
        run: pytest --cov=aegisgate --cov-report=xml --cov-report=term-missing --cov-fail-under=0 -v

      - name: Check coverage floor
        if: matrix.python-version == '3.12'
        # Enforces [tool.coverage.report] fail_under in pyproject.toml (75).
        run: coverage report

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: pip install -e ".[dev,semantic]"

      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 .

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: pip install -e ".[dev,semantic]"

      - name: Mypy
        # Tests are excluded: this gate is the production-module error list.
        run: mypy . --exclude aegisgate/tests

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: pip install -e ".[dev,semantic]"

      - name: Audit installed dependencies
        run: pip-audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        # Build only. Do not push.
        run: docker build --tag aegisgate:ci .
