name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: pip install -e ".[dev,semantic]"

      - name: Detect tests
        id: tests
        shell: bash
        run: |
          if [ -d aegisgate/tests ] && find aegisgate/tests -maxdepth 1 -name 'test_*.py' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tracked tests found under aegisgate/tests" >&2
            exit 1
          fi

      - name: Run tests
        if: matrix.python-version != '3.12'
        timeout-minutes: 8
        run: pytest -v

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        timeout-minutes: 12
        # --cov-fail-under=0 keeps the coverage floor out of *this* step so a
        # test failure is the only thing that can fail it. The floor is checked
        # separately below.
        run: pytest --cov=aegisgate --cov-report=xml --cov-report=term-missing --cov-fail-under=0 -v

      - name: Check coverage floor
        if: matrix.python-version == '3.12'
        # Temporary: reports pyproject.toml's fail_under=50 against the measured
        # number without failing the job, so the real figure is visible before a
        # floor is committed to. Drop continue-on-error once it is enforced.
        continue-on-error: true
        run: coverage report

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
