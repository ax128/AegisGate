enabled_filters:
  - exact_value_redaction
  - redaction
  - request_sanitizer
  - rag_poison_guard
  - anomaly_detector
  - injection_detector
  - privilege_guard
  - tool_call_guard
  - restoration
  - post_restore_guard
  - output_sanitizer
# 0.85: block only on higher-risk hits, which reduces false blocks (lower it to 0.7 to tighten).
risk_threshold: 0.85
