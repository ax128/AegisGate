# strict.yaml — strict detection policy
#
# Design intent:
# - risk_threshold is lower (0.50) than default (0.85), so lower-confidence detections still
#   trigger a block. "strict" therefore means a stricter threshold, not more filters.
# - system_prompt_guard and untrusted_content_guard are deliberately omitted: those two filters
#   suit multi-tenant setups, while the strict policy focuses on tightening the thresholds of the
#   core detection pipeline.
# - To enable extra filters as well, add them to this list and make sure the matching feature
#   flag is turned on.

enabled_filters:
  - exact_value_redaction
  - redaction
  - request_sanitizer
  - rag_poison_guard
  - anomaly_detector
  - injection_detector
  - privilege_guard
  - tool_call_guard
  - restoration
  - post_restore_guard
  - output_sanitizer
risk_threshold: 0.50
