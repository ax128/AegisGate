# Default baseline deployment: starts AegisGate only.

services:
  aegisgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisgate
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:18080:18080"
    expose:
      - "18080"
    networks:
      - default
      - cliproxy_net
      - sub2api_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./config/.env
        required: false
    environment:
      AEGIS_ENV: "prod"
      AEGIS_HOST: "0.0.0.0"
      AEGIS_PORT: "18080"
      AEGIS_ENFORCE_LOOPBACK_ONLY: "false"
      # Optional: once set, /v1/... can be called directly (single-upstream direct mode).
      AEGIS_UPSTREAM_BASE_URL: "${AEGIS_UPSTREAM_BASE_URL:-}"
      AEGIS_SQLITE_DB_PATH: "/app/logs/aegisgate.db"
      AEGIS_AUDIT_LOG_PATH: "/app/logs/audit.jsonl"
      AEGIS_GW_TOKENS_PATH: "/app/aegisgate/policies/rules/gw_tokens.json"
      AEGIS_INIT_STRICT: "true"
      AEGIS_BOOTSTRAP_RULES_DIR: "/app/bootstrap/rules"
      AEGIS_SECURITY_RULES_PATH: "/app/aegisgate/policies/rules/security_filters.yaml"
      # Automatic local-port routing: /v1/__gw__/t/{port}/... → http://host.docker.internal:{port}/v1/...
      AEGIS_ENABLE_LOCAL_PORT_ROUTING: "${AEGIS_ENABLE_LOCAL_PORT_ROUTING:-true}"
      AEGIS_LOCAL_PORT_ROUTING_HOST: "${AEGIS_LOCAL_PORT_ROUTING_HOST:-host.docker.internal}"
      # Automatic Docker upstream injection (registers token → Docker service name at startup;
      # takes precedence over port routing).
      # Format: token:service[:port], comma-separated. When port is omitted it defaults to token.
      # To rename or repoint: edit this variable and restart the gateway.
      AEGIS_DOCKER_UPSTREAMS: "${AEGIS_DOCKER_UPSTREAMS:-8317:cli-proxy-api,8080:sub2api,3000:aiclient2api}"
    volumes:
      - ./logs:/app/logs:rw
      - ./config:/app/aegisgate/policies/rules:rw
      - ./config:/app/config:rw
    tmpfs:
      - /tmp
    restart: unless-stopped

networks:
  cliproxy_net:
    external: true
    name: ${CLIPROXY_NETWORK:-cliproxyapi_default}
  sub2api_net:
    external: true
    name: ${SUB2API_NETWORK:-sub2api-deploy_sub2api-network}
